<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>経費・購入申請 | フロー確認用試作</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="demo">フロー確認用の試作 <span>架空データ専用・このブラウザー内に保存・端末間の共有なし</span></div>
<div class="layout">
<aside><a class="brand" href="./"><span class="brand-icon">経</span><span>経費・購入申請<small>EXPENSE WORKSPACE</small></span></a><div class="nav-label">ワークスペース</div><div class="nav-active">▤　申請一覧</div><div class="side-note">申請の行き先を、明確に。<br>社員から社長へ。<br>承認後は経理へ。</div><button id="reset" class="text-button">架空データにリセット</button></aside>
<main>
<header><div><div class="eyebrow">申請・承認・精算</div><h1>申請一覧</h1></div><label class="role-control">試す役割<select id="role"><option value="employee">社員</option><option value="president">社長</option><option value="accountant">経理</option></select></label></header>
<section class="hero"><div><span class="pill">経理の事前受付を省く</span><h2>申請は、社長へ直接。</h2><p>承認から精算まで、次に誰が動くかが分かります。</p></div><div class="flow"><span>01<b>社員</b><small>申請する</small></span><i>→</i><span>02<b>社長</b><small>承認する</small></span><i>→</i><span>03<b>経理</b><small>精算・処理する</small></span></div></section>
<section class="stats" id="stats" aria-label="申請件数"></section>
<section class="workspace"><div class="toolbar"><div><h2 id="list-title">自分の申請</h2><p id="role-hint"></p></div><button id="new" class="primary">＋ 新しい申請</button></div><div class="filters" id="filters"></div><div id="list"></div></section>
<footer>試作の運用案：経理からの差し戻しは、修正後に社長へ再申請します。実際の送金は行いません。</footer>
</main></div>
<dialog id="detail"><div id="detail-content"></div></dialog>
<dialog id="editor"><form id="request-form"><div class="dialog-head"><div><div class="eyebrow">REQUEST</div><h2 id="form-title">新しい申請</h2></div><button type="button" class="close" data-close="editor" aria-label="閉じる">×</button></div><p id="form-note" class="muted"></p><div class="form-grid"><label id="type-label">申請の種類<select name="type"><option value="travel">出張費精算</option><option value="expense">経費精算</option><option value="purchase">備品購入申請（購入前）</option></select></label><label>日付<input name="date" type="date" required></label><label class="wide">件名<input name="title" required maxlength="80" placeholder="例：大阪出張の交通費"></label><label>金額（円）<input name="amount" type="number" min="1" max="99999999" step="1" required placeholder="28400"></label><label class="wide">用途・明細<textarea name="purpose" rows="4" required maxlength="2000" placeholder="目的、購入内容、交通機関や区間などを入力"></textarea></label><label class="wide">領収書・見積書<input name="files" type="file" accept="image/jpeg,image/png,image/webp,application/pdf" multiple><small>画像・PDF、合計3MBまで。精算と購入実績には領収書が必要です。</small></label><div id="existing-files" class="wide"></div></div><p id="form-error" class="error" role="alert"></p><div class="dialog-actions"><button type="button" class="secondary" data-close="editor">キャンセル</button><button class="primary" id="submit-form">社長へ申請する</button></div></form></dialog>
<div id="toast" role="status" aria-live="polite"></div><script type="module" src="app.mjs"></script>
</body></html>
